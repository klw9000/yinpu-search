<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#8B0000">
    <title>印谱搜索</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
    min-height: 100vh;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
}

header {
    text-align: center;
    margin-bottom: 40px;
}

header h1 {
    font-size: 2.5rem;
    color: #8B0000;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.subtitle {
    font-size: 1.1rem;
    color: #666;
}

.search-section {
    background: white;
    padding: 30px;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    margin-bottom: 0;
    border-bottom: 1px solid #f0f0f0;
}

.search-box {
    display: flex;
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
}

#searchInput {
    flex: 1;
    padding: 14px 20px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.3s;
}

#searchInput:focus {
    border-color: #8B0000;
}

#searchBtn, #galleryBtn {
    padding: 14px 32px;
    font-size: 16px;
    background: #8B0000;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
}

#searchBtn:hover, #galleryBtn:hover {
    background: #a00000;
}

#galleryBtn {
    background: #555;
}

#galleryBtn:hover {
    background: #777;
}

.hint {
    text-align: center;
    margin-top: 15px;
    color: #888;
    font-size: 0.9rem;
}

.results-container {
    background: white;
    padding: 30px;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    min-height: 200px;
    margin-bottom: 20px;
}

.welcome-message {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    font-size: 1.1rem;
}

.char-section {
    margin-bottom: 40px;
}

.char-title {
    font-size: 1.4rem;
    color: #8B0000;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid #f0f0f0;
}

.seal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
}

.seal-card {
    background: #fafafa;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s, box-shadow 0.3s;
}

.seal-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
}

.seal-image {
    width: 100%;
    height: 200px;
    object-fit: contain;
    background: #fff;
    padding: 10px;
}

.seal-name {
    padding: 12px;
    text-align: center;
    font-size: 0.95rem;
    color: #555;
    word-break: break-all;
}

.no-results {
    text-align: center;
    padding: 40px;
    color: #888;
}

.pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 20px 30px;
    background: white;
    border-bottom: 1px solid #f0f0f0;
    flex-wrap: wrap;
}

.pagination button {
    padding: 10px 18px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
}

.pagination button:hover:not(:disabled) {
    background: #8B0000;
    color: white;
    border-color: #8B0000;
}

.pagination button.active {
    background: #8B0000;
    color: white;
    border-color: #8B0000;
}

.pagination button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.page-info {
    text-align: center;
    margin-top: 20px;
    color: #666;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #888;
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>印谱搜索</h1>
            <p class="subtitle">在印谱库中搜索你想要的印章</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="请输入要搜索的汉字..." autocomplete="off">
                <button id="searchBtn">搜索</button>
                <button id="galleryBtn">图片库</button>
            </div>
            <p class="hint">提示：输入多个汉字将分别搜索每个字的印章</p>
        </div>

        <div id="pagination" class="pagination"></div>

        <div id="results" class="results-container">
            <div class="loading">正在加载印章列表...</div>
        </div>
    </div>

    <script>
const sealFiles = [
    "一念如初-边款.jpg",
    "一念如初.jpg",
    "不容易.jpg",
    "与人玫瑰手有余香.jpg",
    "与明白人言.jpg",
    "且接人间二两墨-边款.jpg",
    "且接人间二两墨.jpg",
    "丹青难写是精神.jpg",
    "乐天.jpg",
    "云在青天水在瓶-边款.jpg",
    "云在青天水在瓶.jpg",
    "人生若只如初见-印面.jpg",
    "人生若只如初见-边款.jpg",
    "人生若只如初见.jpg",
    "人间成败不须惊.jpg",
    "似我儿时上学天-边款.jpg",
    "似我儿时上学天.jpg",
    "但从心底祝平安-边款.jpg",
    "但从心底祝平安.jpg",
    "但从心底祝平安A.jpg",
    "但愿人长久千里共婵娟-边款.jpg",
    "但愿人长久千里共婵娟.jpg",
    "但求无愧我心-边款.jpg",
    "但求无愧我心.jpg",
    "低首为公拜榻前-边款.jpg",
    "低首为公拜榻前.jpg",
    "写尽半生皆是错-边款.jpg",
    "别是一般滋味.jpg",
    "半称心-边款.jpg",
    "半称心.jpg",
    "又日新-印.jpg",
    "又日新-边款.jpg",
    "又日新.jpg",
    "只争朝夕.jpg",
    "只记花开不记年.jpg",
    "唯有杜康-边款.jpg",
    "唯有杜康.jpg",
    "坐看云起时-边款.jpg",
    "坐看云起时.jpg",
    "天地元黄喊一年-边款.jpg",
    "天地元黄喊一年.jpg",
    "天行健.jpg",
    "学贵有恒.jpg",
    "小楼一夜-印面.jpg",
    "小楼一夜-边款.jpg",
    "小楼一夜.jpg",
    "尚能饭-边款.jpg",
    "尚能饭.jpg",
    "往往醉后-边款.jpg",
    "往往醉后.jpg",
    "心画.jpg",
    "悲喜自渡.jpg",
    "意在笔先.jpg",
    "愿你们平安-边款.jpg",
    "愿你们平安.jpg",
    "我将无我-印面.jpg",
    "我将无我.jpg",
    "春在枝头已十分-边款.jpg",
    "春在枝头已十分.jpg",
    "沉也坦然.jpg",
    "浮也淡然.jpg",
    "犹未能-印面.jpg",
    "犹未能.jpg",
    "王守桢刻.jpg",
    "白云深处.jpg",
    "真佛只说家常话-印章.jpg",
    "真佛只说家常话-印面.jpg",
    "真佛只说家常话.jpg",
    "真金不镀-边款.jpg",
    "真金不镀.jpg",
    "知不足-边款.jpg",
    "知不足.jpg",
    "知我者二三子-印面.jpg",
    "知我者二三子-边款.jpg",
    "知我者二三子.jpg",
    "笔不尽意-边款.jpg",
    "笔不尽意.jpg",
    "自怡悦.jpg",
    "行到水穷处-边款.jpg",
    "行到水穷处.jpg",
    "赵朴初-边款.jpg",
    "赵朴初.jpg",
    "醉石翁.jpg",
    "随遇而安.jpg",
    "雕塑人生-边款.jpg",
    "雕塑人生.jpg"
];

let allSeals = [];
let searchResults = [];
let currentPage = 0;
const charsPerPage = 1;
let isGalleryMode = false;
let galleryPage = 0;
const galleryPerPage = 20;

function init() {
    allSeals = sealFiles.map(file => {
        const nameWithoutExt = file.replace(/\.[^/.]+$/, "");
        return {
            filename: file,
            name: nameWithoutExt
        };
    });

    document.getElementById('results').innerHTML = `
        <div class="welcome-message">
            <p>欢迎使用印谱搜索！在上方输入框中输入汉字开始搜索。</p>
        </div>
    `;

    document.getElementById('searchBtn').addEventListener('click', performSearch);
    document.getElementById('galleryBtn').addEventListener('click', showGallery);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            performSearch();
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
            .then(registration => {
                console.log('ServiceWorker registered:', registration);
            })
            .catch(error => {
                console.log('ServiceWorker registration failed:', error);
            });
    }
}

function performSearch() {
    const searchInput = document.getElementById('searchInput').value.trim();
    if (!searchInput) {
        return;
    }

    const chars = Array.from(new Set(searchInput.split('').filter(c => c.trim())));
    if (chars.length === 0) {
        return;
    }

    searchResults = [];
    for (const char of chars) {
        const matchedSeals = allSeals.filter(seal => seal.name.includes(char));
        searchResults.push({
            char: char,
            seals: matchedSeals
        });
    }

    currentPage = 0;
    renderResults();
    renderPagination();
}

function showGallery() {
    isGalleryMode = true;
    galleryPage = 0;
    renderGallery();
    renderGalleryPagination();
}

function renderGallery() {
    const resultsContainer = document.getElementById('results');
    const startIdx = galleryPage * galleryPerPage;
    const endIdx = startIdx + galleryPerPage;
    const pageSeals = allSeals.slice(startIdx, endIdx);

    let html = '<div class="gallery-section">';
    html += `<h2 class="char-title">图片库 (${allSeals.length}个印章)</h2>`;
    html += `<div class="seal-grid">`;
    
    for (const seal of pageSeals) {
        html += `
            <div class="seal-card">
                <img src="seal-image/${encodeURIComponent(seal.filename)}" alt="${seal.name}" class="seal-image" onerror="this.style.display='none'">
                <div class="seal-name">${seal.name}</div>
            </div>
        `;
    }
    
    html += `</div>`;
    html += `</div>`;

    resultsContainer.innerHTML = html;
}

function renderGalleryPagination() {
    const paginationContainer = document.getElementById('pagination');
    const totalPages = Math.ceil(allSeals.length / galleryPerPage);
    
    if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
    }
    
    let html = '';
    
    html += `<button ${galleryPage === 0 ? 'disabled' : ''} onclick="goToGalleryPage(${galleryPage - 1})">上一页</button>`;
    
    for (let i = 0; i < totalPages; i++) {
        html += `<button class="${galleryPage === i ? 'active' : ''}" onclick="goToGalleryPage(${i})">${i + 1}</button>`;
    }
    
    html += `<button ${galleryPage === totalPages - 1 ? 'disabled' : ''} onclick="goToGalleryPage(${galleryPage + 1})">下一页</button>`;
    
    html += `<div class="page-info" style="width:100%;">第 ${galleryPage + 1} 页 / 共 ${totalPages} 页</div>`;
    
    paginationContainer.innerHTML = html;
}

function goToGalleryPage(page) {
    galleryPage = page;
    renderGallery();
    renderGalleryPagination();
}

function renderResults() {
    isGalleryMode = false;
    const resultsContainer = document.getElementById('results');
    
    if (searchResults.length === 0) {
        resultsContainer.innerHTML = `
            <div class="welcome-message">
                <p>欢迎使用印谱搜索！在上方输入框中输入汉字开始搜索。</p>
            </div>
        `;
        return;
    }

    const startIdx = currentPage * charsPerPage;
    const endIdx = startIdx + charsPerPage;
    const pageResults = searchResults.slice(startIdx, endIdx);

    let html = '';
    for (const result of pageResults) {
        html += `<div class="char-section">`;
        html += `<h2 class="char-title">含“${result.char}”的印章 (${result.seals.length}个)</h2>`;
        
        if (result.seals.length === 0) {
            html += `<div class="no-results">没有找到包含“${result.char}”的印章</div>`;
        } else {
            html += `<div class="seal-grid">`;
            for (const seal of result.seals) {
                html += `
                    <div class="seal-card">
                        <img src="seal-image/${encodeURIComponent(seal.filename)}" alt="${seal.name}" class="seal-image" onerror="this.style.display='none'">
                        <div class="seal-name">${seal.name}</div>
                    </div>
                `;
            }
            html += `</div>`;
        }
        html += `</div>`;
    }

    resultsContainer.innerHTML = html;
}

function renderPagination() {
    const paginationContainer = document.getElementById('pagination');
    
    if (isGalleryMode) {
        return;
    }
    
    if (searchResults.length <= charsPerPage) {
        paginationContainer.innerHTML = '';
        return;
    }

    const totalPages = Math.ceil(searchResults.length / charsPerPage);
    
    let html = '';
    
    html += `<button ${currentPage === 0 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">上一页</button>`;
    
    for (let i = 0; i < totalPages; i++) {
        const char = searchResults[i].char;
        html += `<button class="${currentPage === i ? 'active' : ''}" onclick="goToPage(${i})">${char}</button>`;
    }
    
    html += `<button ${currentPage === totalPages - 1 ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">下一页</button>`;
    
    html += `<div class="page-info" style="width:100%;">第 ${currentPage + 1} 页 / 共 ${totalPages} 页</div>`;
    
    paginationContainer.innerHTML = html;
}

function goToPage(page) {
    currentPage = page;
    renderResults();
    renderPagination();
}

init();
    </script>
</body>
</html>
