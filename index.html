<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#8B0000">
    <title>印谱搜索</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/apple-touch-icon-167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/apple-touch-icon-152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="./icons/apple-touch-icon-120.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
    min-height: 100vh;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
}

header {
    text-align: center;
    margin-bottom: 40px;
}

header h1 {
    font-size: 2.5rem;
    color: #8B0000;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.subtitle {
    font-size: 1.1rem;
    color: #666;
}

.search-section {
    background: white;
    padding: 30px;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    margin-bottom: 0;
    border-bottom: 1px solid #f0f0f0;
}

.search-box {
    display: flex;
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
}

#searchInput {
    flex: 1;
    padding: 14px 20px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.3s;
}

#searchInput:focus {
    border-color: #8B0000;
}

#searchBtn, #galleryBtn {
    padding: 14px 32px;
    font-size: 16px;
    background: #8B0000;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
}

#searchBtn:hover, #galleryBtn:hover {
    background: #a00000;
}

#galleryBtn {
    background: #555;
}

#galleryBtn:hover {
    background: #777;
}

.hint {
    text-align: center;
    margin-top: 15px;
    color: #888;
    font-size: 0.9rem;
}

.results-container {
    background: white;
    padding: 30px;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    min-height: 200px;
    margin-bottom: 20px;
}

.welcome-message {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    font-size: 1.1rem;
}

.char-section {
    margin-bottom: 40px;
}

.char-title {
    font-size: 1.4rem;
    color: #8B0000;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid #f0f0f0;
}

.seal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
}

.seal-card {
    background: #fafafa;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: zoom-in;
}

.seal-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
}

.seal-image {
    width: 100%;
    height: 200px;
    object-fit: contain;
    background: #fff;
    padding: 10px;
}

.seal-name {
    padding: 12px;
    text-align: center;
    font-size: 0.95rem;
    color: #555;
    word-break: break-all;
}

.no-results {
    text-align: center;
    padding: 40px;
    color: #888;
}

.pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 20px 30px;
    background: white;
    border-bottom: 1px solid #f0f0f0;
    flex-wrap: wrap;
}

.pagination button {
    padding: 10px 18px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
}

.pagination button:hover:not(:disabled) {
    background: #8B0000;
    color: white;
    border-color: #8B0000;
}

.pagination button.active {
    background: #8B0000;
    color: white;
    border-color: #8B0000;
}

.pagination button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.page-info {
    text-align: center;
    margin-top: 20px;
    color: #666;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #888;
}

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 40px 20px;
    cursor: zoom-out;
}

.lightbox.open {
    display: flex;
}

.lightbox img {
    max-width: 95vw;
    max-height: 85vh;
    object-fit: contain;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    background: #fff;
}

.lightbox-caption {
    margin-top: 16px;
    color: #f0f0f0;
    font-size: 1rem;
    text-align: center;
    max-width: 90vw;
    word-break: break-all;
}

.lightbox-close {
    position: absolute;
    top: 20px;
    right: 24px;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s;
}

.lightbox-close:hover {
    background: rgba(255, 255, 255, 0.3);
}

/* ---------- Responsive ---------- */

/* Fluid type for the title across all sizes. */
header h1 {
    font-size: clamp(1.7rem, 5.5vw, 2.5rem);
}

/* Disable hover lift on touch devices — otherwise the transform sticks
   after a tap and looks broken on phones. */
@media (hover: none) {
    .seal-card:hover {
        transform: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .pagination button:hover:not(:disabled) {
        background: white;
        color: inherit;
        border-color: #ddd;
    }
    .pagination button.active,
    .pagination button:active {
        background: #8B0000;
        color: white;
        border-color: #8B0000;
    }
}

/* Tablets & narrower laptops / foldable inner display. */
@media (max-width: 1023px) {
    .container { padding: 28px 16px; }
    header { margin-bottom: 28px; }
    .search-section { padding: 22px; }
    .results-container { padding: 22px; }
    .seal-grid {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 16px;
    }
    .seal-image { height: 180px; }
}

/* Phones (portrait) + foldable outer display. */
@media (max-width: 640px) {
    .container { padding: 16px 12px; }
    header { margin-bottom: 18px; }
    .subtitle { font-size: 0.95rem; }

    .search-section,
    .results-container { padding: 16px; }

    /* Stack: full-width input on row 1, two buttons share row 2. */
    .search-box { flex-wrap: wrap; gap: 8px; }
    #searchInput {
        flex-basis: 100%;
        padding: 12px 14px;
        font-size: 16px; /* keep 16px to suppress iOS auto-zoom on focus */
    }
    #searchBtn, #galleryBtn {
        flex: 1;
        padding: 12px 0;
        font-size: 15px;
    }

    .hint { font-size: 0.8rem; margin-top: 10px; }

    .char-section { margin-bottom: 24px; }
    .char-title {
        font-size: 1.15rem;
        margin-bottom: 14px;
        padding-bottom: 8px;
    }

    .seal-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
    }
    .seal-image { height: 140px; padding: 6px; }
    .seal-name { padding: 8px; font-size: 0.85rem; }

    .pagination {
        padding: 12px;
        gap: 6px;
    }
    .pagination button {
        padding: 8px 12px;
        font-size: 0.9rem;
    }

    /* Lightbox: respect notch / dynamic island via safe-area. */
    .lightbox { padding: 20px 12px; }
    .lightbox img { max-width: 96vw; max-height: 78vh; }
    .lightbox-caption { font-size: 0.9rem; margin-top: 10px; }
    .lightbox-close {
        top: calc(12px + env(safe-area-inset-top, 0px));
        right: calc(12px + env(safe-area-inset-right, 0px));
        width: 40px;
        height: 40px;
        font-size: 22px;
    }
}

/* Very narrow: small phones, foldable closed cover (~280–360px). */
@media (max-width: 380px) {
    .container { padding: 12px 8px; }
    .search-section,
    .results-container { padding: 12px; }
    .seal-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
    }
    .seal-image { height: 120px; }
    .pagination button {
        padding: 7px 10px;
        font-size: 0.85rem;
    }
}

/* Phone in landscape: cap lightbox image by height, not viewport width,
   so the close button doesn't fight for space with the image. */
@media (max-height: 500px) and (orientation: landscape) {
    .lightbox { padding: 12px 60px; }
    .lightbox img { max-height: 80vh; }
    .lightbox-caption { display: none; }
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>印谱搜索</h1>
            <p class="subtitle">在印谱库中搜索你想要的印章</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="请输入要搜索的汉字..." autocomplete="off">
                <button id="searchBtn">搜索</button>
                <button id="galleryBtn">图片库</button>
            </div>
            <p class="hint">提示：输入多个汉字将分别搜索每个字的印章</p>
        </div>

        <div id="pagination" class="pagination"></div>

        <div id="results" class="results-container">
            <div class="loading">正在加载印章列表...</div>
        </div>
    </div>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="印章大图">
        <button type="button" class="lightbox-close" aria-label="关闭">&times;</button>
        <img id="lightboxImg" alt="">
        <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>

    <script>
let allSeals = [];
let searchResults = [];
let currentPage = 0;
const charsPerPage = 1;
let isGalleryMode = false;
let galleryPage = 0;
const galleryPerPage = 20;

async function init() {
    const resultsEl = document.getElementById('results');

    try {
        const resp = await fetch('./seals.json', { cache: 'no-cache' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const sealFiles = await resp.json();
        allSeals = sealFiles.map(file => ({
            filename: file,
            name: file.replace(/\.[^/.]+$/, "")
        }));
    } catch (err) {
        resultsEl.innerHTML = `
            <div class="no-results">
                <p>加载印章列表失败：${err.message}</p>
                <p style="margin-top:10px;font-size:0.9rem;color:#aaa;">请检查 seals.json 是否存在，或重新运行 scripts/generate-seals.sh</p>
            </div>
        `;
        return;
    }

    resultsEl.innerHTML = `
        <div class="welcome-message">
            <p>欢迎使用印谱搜索！在上方输入框中输入汉字开始搜索。</p>
            <p style="margin-top:10px;font-size:0.9rem;color:#aaa;">共 ${allSeals.length} 个印章可供检索</p>
        </div>
    `;

    document.getElementById('searchBtn').addEventListener('click', performSearch);
    document.getElementById('galleryBtn').addEventListener('click', showGallery);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            performSearch();
        }
    });

    resultsEl.addEventListener('click', (e) => {
        const card = e.target.closest('.seal-card');
        if (!card) return;
        const img = card.querySelector('.seal-image');
        const nameEl = card.querySelector('.seal-name');
        if (img && img.src) {
            openLightbox(img.src, nameEl ? nameEl.textContent : '');
        }
    });

    const lightbox = document.getElementById('lightbox');
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.classList.contains('lightbox-close')) {
            closeLightbox();
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('open')) {
            closeLightbox();
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
            .then(registration => {
                console.log('ServiceWorker registered:', registration);
            })
            .catch(error => {
                console.log('ServiceWorker registration failed:', error);
            });
    }
}

function performSearch() {
    const searchInput = document.getElementById('searchInput').value.trim();
    if (!searchInput) {
        return;
    }

    const chars = Array.from(new Set(searchInput.split('').filter(c => c.trim())));
    if (chars.length === 0) {
        return;
    }

    searchResults = [];
    for (const char of chars) {
        const matchedSeals = allSeals.filter(seal => seal.name.includes(char));
        searchResults.push({
            char: char,
            seals: matchedSeals
        });
    }

    currentPage = 0;
    renderResults();
    renderPagination();
}

function showGallery() {
    isGalleryMode = true;
    galleryPage = 0;
    renderGallery();
    renderGalleryPagination();
}

function renderGallery() {
    const resultsContainer = document.getElementById('results');
    const startIdx = galleryPage * galleryPerPage;
    const endIdx = startIdx + galleryPerPage;
    const pageSeals = allSeals.slice(startIdx, endIdx);

    let html = '<div class="gallery-section">';
    html += `<h2 class="char-title">图片库 (${allSeals.length}个印章)</h2>`;
    html += `<div class="seal-grid">`;
    
    for (const seal of pageSeals) {
        html += `
            <div class="seal-card">
                <img src="seal-image/${encodeURIComponent(seal.filename)}" alt="${seal.name}" class="seal-image" onerror="this.style.display='none'">
                <div class="seal-name">${seal.name}</div>
            </div>
        `;
    }
    
    html += `</div>`;
    html += `</div>`;

    resultsContainer.innerHTML = html;
}

function renderGalleryPagination() {
    const paginationContainer = document.getElementById('pagination');
    const totalPages = Math.ceil(allSeals.length / galleryPerPage);
    
    if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
    }
    
    let html = '';
    
    html += `<button ${galleryPage === 0 ? 'disabled' : ''} onclick="goToGalleryPage(${galleryPage - 1})">上一页</button>`;
    
    for (let i = 0; i < totalPages; i++) {
        html += `<button class="${galleryPage === i ? 'active' : ''}" onclick="goToGalleryPage(${i})">${i + 1}</button>`;
    }
    
    html += `<button ${galleryPage === totalPages - 1 ? 'disabled' : ''} onclick="goToGalleryPage(${galleryPage + 1})">下一页</button>`;
    
    html += `<div class="page-info" style="width:100%;">第 ${galleryPage + 1} 页 / 共 ${totalPages} 页</div>`;
    
    paginationContainer.innerHTML = html;
}

function goToGalleryPage(page) {
    galleryPage = page;
    renderGallery();
    renderGalleryPagination();
}

function renderResults() {
    isGalleryMode = false;
    const resultsContainer = document.getElementById('results');
    
    if (searchResults.length === 0) {
        resultsContainer.innerHTML = `
            <div class="welcome-message">
                <p>欢迎使用印谱搜索！在上方输入框中输入汉字开始搜索。</p>
            </div>
        `;
        return;
    }

    const startIdx = currentPage * charsPerPage;
    const endIdx = startIdx + charsPerPage;
    const pageResults = searchResults.slice(startIdx, endIdx);

    let html = '';
    for (const result of pageResults) {
        html += `<div class="char-section">`;
        html += `<h2 class="char-title">含“${result.char}”的印章 (${result.seals.length}个)</h2>`;
        
        if (result.seals.length === 0) {
            html += `<div class="no-results">没有找到包含“${result.char}”的印章</div>`;
        } else {
            html += `<div class="seal-grid">`;
            for (const seal of result.seals) {
                html += `
                    <div class="seal-card">
                        <img src="seal-image/${encodeURIComponent(seal.filename)}" alt="${seal.name}" class="seal-image" onerror="this.style.display='none'">
                        <div class="seal-name">${seal.name}</div>
                    </div>
                `;
            }
            html += `</div>`;
        }
        html += `</div>`;
    }

    resultsContainer.innerHTML = html;
}

function renderPagination() {
    const paginationContainer = document.getElementById('pagination');
    
    if (isGalleryMode) {
        return;
    }
    
    if (searchResults.length <= charsPerPage) {
        paginationContainer.innerHTML = '';
        return;
    }

    const totalPages = Math.ceil(searchResults.length / charsPerPage);
    
    let html = '';
    
    html += `<button ${currentPage === 0 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">上一页</button>`;
    
    for (let i = 0; i < totalPages; i++) {
        const { char, seals } = searchResults[i];
        html += `<button class="${currentPage === i ? 'active' : ''}" onclick="goToPage(${i})">${char} (${seals.length})</button>`;
    }
    
    html += `<button ${currentPage === totalPages - 1 ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">下一页</button>`;
    
    html += `<div class="page-info" style="width:100%;">第 ${currentPage + 1} 页 / 共 ${totalPages} 页</div>`;
    
    paginationContainer.innerHTML = html;
}

function goToPage(page) {
    currentPage = page;
    renderResults();
    renderPagination();
}

function openLightbox(src, caption) {
    const lightbox = document.getElementById('lightbox');
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxImg').alt = caption || '';
    document.getElementById('lightboxCaption').textContent = caption || '';
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    const lightbox = document.getElementById('lightbox');
    lightbox.classList.remove('open');
    document.getElementById('lightboxImg').src = '';
    document.body.style.overflow = '';
}

init();
    </script>
</body>
</html>
